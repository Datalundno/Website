name: Deploy Datalund site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Workflow-artifact Pages deploys have been stuck in deployment_queued then
      # failing for this repo. Publish the built site to the gh-pages branch instead.
      - name: Ensure Pages uses gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type | grep -qx legacy; then
            current=$(gh api "repos/${{ github.repository }}/pages" --jq '.source.branch + ":" + .source.path')
            echo "Pages already legacy ($current)"
          else
            echo "Switching Pages from workflow builds to gh-pages branch"
          fi
          gh api "repos/${{ github.repository }}/pages" -X PUT \
            -f build_type=legacy \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/' \
            || gh api "repos/${{ github.repository }}/pages" -X POST \
              -f build_type=legacy \
              -f 'source[branch]=gh-pages' \
              -f 'source[path]=/'
          gh api "repos/${{ github.repository }}/pages" --jq '{build_type,source,html_url,cname}'

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          cname: datalund.no
