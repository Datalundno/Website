<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="rlTitle rlDesc">
  <title id="rlTitle">DataLund Resource Load</title>
  <desc id="rlDesc">People on overlapping tasks with peak-load badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F2EE"/>
      <stop offset="60%" stop-color="#F4FAF7"/>
      <stop offset="100%" stop-color="#DCEEE7"/>
    </linearGradient>
    <filter id="soft" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F3D36" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <circle cx="860" cy="70" r="150" fill="#2DD4BF" opacity="0.12"/>
  <circle cx="80" cy="480" r="110" fill="#FBBF24" opacity="0.1"/>

  <text x="48" y="48" font-family="Public Sans, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.14em" fill="#1A6B5C">LOAD</text>
  <text x="48" y="80" font-family="Bricolage Grotesque, Georgia, serif" font-size="28" font-weight="700" fill="#0F3D36">Who's busy when</text>

  <g filter="url(#soft)">
    <rect x="48" y="108" width="864" height="392" rx="18" fill="#fff" stroke="#0F3D36" stroke-opacity="0.1"/>
  </g>
  <rect x="48" y="108" width="864" height="40" rx="18" fill="#F4FAF7"/>
  <rect x="48" y="128" width="864" height="20" fill="#F4FAF7"/>
  <circle cx="72" cy="128" r="5" fill="#F87171"/>
  <circle cx="90" cy="128" r="5" fill="#FBBF24"/>
  <circle cx="108" cy="128" r="5" fill="#34D399"/>
  <text x="132" y="133" font-family="Public Sans, system-ui, sans-serif" font-size="12" fill="#3D5A54">Capacity · DataLund Resource Load</text>

  <!-- month headers -->
  <g font-family="Public Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#3D5A54">
    <text x="280" y="178">JUN</text>
    <text x="430" y="178">JUL</text>
    <text x="580" y="178">AUG</text>
    <text x="730" y="178">SEP</text>
  </g>
  <g stroke="#0F3D36" stroke-opacity="0.07">
    <line x1="260" y1="188" x2="260" y2="470"/>
    <line x1="410" y1="188" x2="410" y2="470"/>
    <line x1="560" y1="188" x2="560" y2="470"/>
    <line x1="710" y1="188" x2="710" y2="470"/>
  </g>
  <line x1="640" y1="188" x2="640" y2="470" stroke="#0F3D36" stroke-dasharray="5 6" stroke-opacity="0.4"/>
  <circle cx="640" cy="188" r="4" fill="#FBBF24"/>

  <!-- Ada -->
  <text x="72" y="230" font-family="Public Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#142821">Ada Ng</text>
  <rect x="168" y="214" width="28" height="20" rx="10" fill="#FBBF24"/>
  <text x="182" y="228" text-anchor="middle" font-family="Public Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#142821">3</text>
  <rect x="270" y="214" width="180" height="16" rx="5" fill="#2DD4BF"/>
  <rect x="390" y="236" width="170" height="16" rx="5" fill="#0F3D36"/>
  <rect x="560" y="214" width="150" height="16" rx="5" fill="#1A6B5C"/>

  <!-- Bo -->
  <text x="72" y="310" font-family="Public Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#142821">Bo Berg</text>
  <rect x="168" y="294" width="28" height="20" rx="10" fill="#FBBF24"/>
  <text x="182" y="308" text-anchor="middle" font-family="Public Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#142821">2</text>
  <rect x="300" y="294" width="210" height="16" rx="5" fill="#1A6B5C"/>
  <rect x="470" y="316" width="160" height="16" rx="5" fill="#FBBF24"/>
  <rect x="560" y="338" width="120" height="14" rx="5" fill="#EF4444" opacity="0.85"/>

  <!-- Sam -->
  <text x="72" y="400" font-family="Public Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#142821">Sam Ortiz</text>
  <rect x="168" y="384" width="28" height="20" rx="10" fill="#2DD4BF"/>
  <text x="182" y="398" text-anchor="middle" font-family="Public Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F3D36">1</text>
  <rect x="410" y="384" width="200" height="16" rx="5" fill="#0F3D36"/>

  <!-- Jordan -->
  <text x="72" y="460" font-family="Public Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#142821">Jordan Lee</text>
  <rect x="168" y="444" width="28" height="20" rx="10" fill="#2DD4BF"/>
  <text x="182" y="458" text-anchor="middle" font-family="Public Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F3D36">1</text>
  <rect x="280" y="444" width="160" height="16" rx="5" fill="#7CFFB2"/>
</svg>
